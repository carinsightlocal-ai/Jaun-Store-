<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Login — Jaun Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/icons/warmup/icon128.png">
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo-badge" title="Jaun Store Home">
          <svg viewBox="0 0 24 24">
            <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5m14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
          </svg>
        </a>
        <h1 class="auth-title">Welcome to <span>Jaun Store</span></h1>
        <p class="auth-subtitle">Sign in with your account or access the Admin Panel</p>
      </div>

      <form id="loginForm">
        <div class="auth-form-group">
          <label for="loginEmail">Email Address</label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="email" id="loginEmail" class="auth-input" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="auth-form-group">
          <label for="loginPassword">Password</label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0110 0v4"></path>
              </svg>
            </span>
            <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="auth-password-toggle" id="togglePasswordBtn" title="Show / Hide Password">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="eyeIcon">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div id="authAlert" class="auth-alert-message"></div>

        <button type="submit" class="btn-auth-submit" id="btnLoginSubmit">
          <span>Sign In</span>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="auth-footer-links">
        <p>Don't have an account? <a href="signup.html">Sign Up for Free</a></p>
        <p style="margin-top: 10px;">
          <a href="index.html" style="color: var(--text-muted); font-weight: 500;">&larr; Back to Jaun Store</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { backend } from './js/firebase-backend.js';

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');
    const passInput = document.getElementById('loginPassword');
    const alertBox = document.getElementById('authAlert');
    const submitBtn = document.getElementById('btnLoginSubmit');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    });

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = `auth-alert-message ${type}`;
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passInput.value.trim();

      if (!email || !password) {
        showAlert('Please enter both email and password.');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Signing In...</span>';
        alertBox.style.display = 'none';

        const res = await backend.loginUser(email, password);
        
        if (res.user.isAdmin) {
          showAlert('👑 Welcome Jaun Admin! Redirecting to Admin Panel...', 'success');
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 800);
        } else {
          showAlert(`Welcome back, ${res.user.displayName}! Redirecting...`, 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
        }
      } catch (err) {
        showAlert(err.message || 'Login failed. Please verify credentials.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <span>Sign In</span>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        `;
      }
    });
  </script>
</body>
</html>
